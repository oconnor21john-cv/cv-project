services:

  # ── Reverse proxy (auto HTTPS via Let's Encrypt) ──────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - order-service

  # ── Kafka (single-node KRaft) ──────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CLUSTER_ID=${KAFKA_CLUSTER_ID}

  # ── Databases ──────────────────────────────────────────────────────────────
  orders-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=orders
      - POSTGRES_USER=orders
      - POSTGRES_PASSWORD=${ORDERS_DB_PASSWORD}
    volumes:
      - orders_data:/var/lib/postgresql/data

  inventory-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=inventory
      - POSTGRES_USER=inventory
      - POSTGRES_PASSWORD=${INVENTORY_DB_PASSWORD}
    volumes:
      - inventory_data:/var/lib/postgresql/data

  payments-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=payments
      - POSTGRES_USER=payments
      - POSTGRES_PASSWORD=${PAYMENTS_DB_PASSWORD}
    volumes:
      - payments_data:/var/lib/postgresql/data

  # ── Services ───────────────────────────────────────────────────────────────
  inventory-service:
    build:
      context: ./inventory-service
    restart: unless-stopped
    depends_on:
      - kafka
      - inventory-db
    environment:
      - SERVER_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:postgresql://inventory-db:5432/inventory
      - SPRING_DATASOURCE_USERNAME=inventory
      - SPRING_DATASOURCE_PASSWORD=${INVENTORY_DB_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092

  payment-service:
    build:
      context: ./payment-service
    restart: unless-stopped
    depends_on:
      - kafka
      - payments-db
    environment:
      - SERVER_PORT=8083
      - SPRING_DATASOURCE_URL=jdbc:postgresql://payments-db:5432/payments
      - SPRING_DATASOURCE_USERNAME=payments
      - SPRING_DATASOURCE_PASSWORD=${PAYMENTS_DB_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092

  order-service:
    build:
      context: ./order-service
    restart: unless-stopped
    depends_on:
      - kafka
      - orders-db
      - inventory-service
      - payment-service
    environment:
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:postgresql://orders-db:5432/orders
      - SPRING_DATASOURCE_USERNAME=orders
      - SPRING_DATASOURCE_PASSWORD=${ORDERS_DB_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - INVENTORY_BASE_URL=http://inventory-service:8082
      - PAYMENT_BASE_URL=http://payment-service:8083
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}

volumes:
  caddy_data:
  caddy_config:
  orders_data:
  inventory_data:
  payments_data:
