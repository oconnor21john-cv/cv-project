services:
  kafka:
    image: apache/kafka:3.7.0
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CLUSTER_ID=l32N8tTuQl-DlDy3x7299Q
    ports:
      - "9092:9092"

  orders-db:
    image: postgres:latest
    environment:
      - POSTGRES_DB=orders
      - POSTGRES_USER=orders
      - POSTGRES_PASSWORD=orders
    ports:
      - "5433:5432"

  inventory-db:
    image: postgres:latest
    environment:
      - POSTGRES_DB=inventory
      - POSTGRES_USER=inventory
      - POSTGRES_PASSWORD=inventory
    ports:
      - "5434:5432"

  payments-db:
    image: postgres:latest
    environment:
      - POSTGRES_DB=payments
      - POSTGRES_USER=payments
      - POSTGRES_PASSWORD=payments
    ports:
      - "5435:5432"

  inventory-service:
    build:
      context: ./inventory-service
    depends_on:
      - kafka
      - inventory-db
    environment:
      - SERVER_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:postgresql://inventory-db:5432/inventory
      - SPRING_DATASOURCE_USERNAME=inventory
      - SPRING_DATASOURCE_PASSWORD=inventory
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8082:8082"

  payment-service:
    build:
      context: ./payment-service
    depends_on:
      - kafka
      - payments-db
    environment:
      - SERVER_PORT=8083
      - SPRING_DATASOURCE_URL=jdbc:postgresql://payments-db:5432/payments
      - SPRING_DATASOURCE_USERNAME=payments
      - SPRING_DATASOURCE_PASSWORD=payments
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8083:8083"

  order-service:
    build:
      context: ./order-service
    depends_on:
      - kafka
      - orders-db
      - inventory-service
      - payment-service
    environment:
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:postgresql://orders-db:5432/orders
      - SPRING_DATASOURCE_USERNAME=orders
      - SPRING_DATASOURCE_PASSWORD=orders
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - INVENTORY_BASE_URL=http://inventory-service:8082
      - PAYMENT_BASE_URL=http://payment-service:8083
      - JWT_SECRET=dev-secret-change-me-please-use-at-least-32-bytes
    ports:
      - "8081:8081"

  web-ui:
    build:
      context: ./web-ui
    depends_on:
      - order-service
    ports:
      - "5173:80"

