<!DOCTYPE html>
<html>
<head>
    <title>IT Help Request</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>WearView Academy IT Help</h1>
        </div>
        
        <!-- Login Page -->
        <div id="loginPage">
            <h2>Login</h2>
            <form id="loginForm">
                <div>
                    <label>Username:</label>
                    <input type="text" id="username">
                    <span id="userError" class="error"></span>
                </div>
                <div>
                    <label>Password:</label>
                    <input type="password" id="password">
                    <button type="button" id="showPassword">Show</button>
                </div>
                <button>Login</button>
            </form>
        </div>
        
        <!-- Staff Form -->
        <div id="staffPage" style="display:none;">
            <h2>Report Problem</h2>
            <form id="staffForm">
                <div>
                    <label>Your Name:</label>
                    <input type="text" id="name">
                </div>
                <div>
                    <label>Email:</label>
                    <input type="text" id="email">
                </div>
                <div>
                    <label>Where is the problem?</label>
                    <input type="text" id="location">
                </div>
                <div>
                    <label>Describe the issue:</label>
                    <textarea id="description"></textarea>
                </div>
                <button>Submit Request</button>
            </form>
            <button id="staffLogout">Logout</button>
        </div>
        
        <!-- Technician View -->
        <div id="techPage" style="display:none;">
            <h2>IT Technician Dashboard</h2>
            <div>
                <button id="showIncomplete">Show Incomplete Jobs</button>
                <button id="showCompleted">Show Completed Jobs</button>
            </div>
            <div id="jobList"></div>
            <button id="techLogout">Logout</button>
        </div>
    </div>
    
    <script src="jsvalidation.js"></script>
</body>
</html>
