<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IT Request Portal for staff and technicians">
    <title>IT Request Portal</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
    <div id="live-region" aria-live="polite" class="sr-only"></div>

    <div class="container" role="main">
        <div class="school-banner">
            <div class="logo">
                <span class="w">W</span>
                <span class="v">V</span>
            </div>
            <div class="school-name">WearView Academy</div>
        </div>
        <h1>IT Request Portal</h1>
        <div id="loginPage">
            <h2>Login</h2>
            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required 
                           minlength="3" maxlength="50"
                           autocomplete="username">
                    <span id="username-error" class="error"></span>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <div class="password-container">
                    <input type="password" id="password" name="password" required 
                               minlength="8"
                           autocomplete="current-password">
                        <button type="button" id="togglePassword" class="toggle-password" aria-label="Show password">
                            View
                        </button>
                    </div>
                    <span id="password-error" class="error"></span>
                </div>
                <button type="submit">Login</button>
            </form>
        </div>
        <div id="staffPage" class="hidden">
            <h2>Report IT Issue</h2>
            <form id="staffForm" novalidate>
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required 
                           minlength="2" maxlength="100"
                           autocomplete="name">
                    <span id="name-error" class="error"></span>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required 
                           autocomplete="email">
                    <span id="email-error" class="error"></span>
                </div>
                <div class="form-group">
                    <label for="location">Location:</label>
                    <input type="text" id="location" name="location" required 
                           minlength="2" maxlength="100">
                    <span id="location-error" class="error"></span>
                </div>
                <div class="form-group">
                    <label for="description">Description:</label>
                    <textarea id="description" name="description" required 
                              minlength="10" maxlength="500"></textarea>
                    <span id="description-error" class="error"></span>
                </div>
                <button type="submit">Submit</button>
            </form>
            <button id="staffLogout" type="button">Logout</button>
        </div>
        <div id="technicianPage" class="hidden">
            <h2>Technician Portal</h2>
            <div class="button-group" role="group" aria-label="Job filters">
                <button id="incompleteJobs" type="button">Incomplete Jobs</button>
                <button id="completedJobs" type="button">Completed Jobs</button>
            </div>
            <div id="jobList" role="list" aria-label="Job list"></div>
            <button id="technicianLogout" type="button">Logout</button>
        </div>
    </div>
    <script src="jsvalidation.js"></script>
</body>
</html>
