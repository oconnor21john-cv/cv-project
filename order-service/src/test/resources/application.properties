spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

spring.datasource.url=jdbc:h2:mem:orders_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.kafka.listener.auto-startup=false

spring.kafka.bootstrap-servers=localhost:9092

app.kafka.topic.orders=orders.events
app.kafka.topic.inventory=inventory.events
app.kafka.topic.payments=payments.events

app.inventory.base-url=http://localhost:8082
app.payment.base-url=http://localhost:8083

app.security.jwt.issuer=portfolio
app.security.jwt.secret=test-secret-that-is-at-least-thirty-two-bytes-long

