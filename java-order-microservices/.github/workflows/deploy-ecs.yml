name: Deploy to AWS ECS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'order-service/**'
      - 'inventory-service/**'
      - 'payment-service/**'
      - 'docker-compose.yml'

env:
  AWS_REGION: eu-west-2
  ECR_PREFIX: java-order-ms

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        service: [order-service, inventory-service, payment-service]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: ./gradlew test

  deploy:
    name: Build & deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        service: [order-service, inventory-service, payment-service]

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        working-directory: ${{ matrix.service }}
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/${{ matrix.service }}:$IMAGE_TAG \
                        -t $ECR_REGISTRY/${{ matrix.service }}:latest .
          docker push $ECR_REGISTRY/${{ matrix.service }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ matrix.service }}:latest

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster java-order-ms-cluster \
            --service ${{ matrix.service }} \
            --force-new-deployment \
            --region eu-west-2
