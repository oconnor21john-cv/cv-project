# Local development profile
# NOTE: do NOT set `spring.profiles.active` here — Spring Boot forbids it inside
# a profile-specific file. The profile is selected via the SPRING_PROFILES_ACTIVE
# environment variable (set in docker-compose.yml) or via @ActiveProfiles in tests.

# Dev JWT secret - ONLY use this in local development
app.security.jwt.secret=dev-secret-change-me-please-use-at-least-32-bytes

# Logging for local development
logging.level.com.portfolio=DEBUG
logging.level.org.springframework.security=DEBUG
