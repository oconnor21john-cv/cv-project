spring.application.name=order-service
server.port=${SERVER_PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orders}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:orders}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:orders}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

app.sqs.enabled=${APP_SQS_ENABLED:false}
app.sqs.queue.orders.url=${APP_SQS_QUEUE_ORDERS_URL:}

app.inventory.base-url=${INVENTORY_BASE_URL:http://localhost:8082}
app.payment.base-url=${PAYMENT_BASE_URL:http://localhost:8083}

app.security.jwt.issuer=portfolio
app.security.jwt.secret=${JWT_SECRET:dev-secret-change-me-please-use-at-least-32-bytes}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

resilience4j.circuitbreaker.instances.inventory.sliding-window-size=10
resilience4j.circuitbreaker.instances.inventory.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventory.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.inventory.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.inventory.register-health-indicator=true

resilience4j.circuitbreaker.instances.payment.sliding-window-size=10
resilience4j.circuitbreaker.instances.payment.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.payment.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.payment.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.payment.register-health-indicator=true

management.endpoints.web.exposure.include=health,info
