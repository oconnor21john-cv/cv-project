spring.application.name=payment-service
server.port=${SERVER_PORT:8083}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payments}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:payments}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:payments}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

app.sqs.enabled=${APP_SQS_ENABLED:false}
app.sqs.queue.payments.url=${APP_SQS_QUEUE_PAYMENTS_URL:}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

management.endpoints.web.exposure.include=health,info
